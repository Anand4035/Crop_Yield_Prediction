<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌾 Crop Yield Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.6)),
                url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Floating Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .main-container {
            padding: 50px 20px;
        }

        .glass-card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 40px;
            animation: float 4s ease-in-out infinite;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ddd;
            margin-bottom: 35px;
            font-size: 1.1rem;
        }

        .form-label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: white;
            border-radius: 15px;
            padding: 14px;
            transition: 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.5);
            border: 1px solid #00ff99;
        }

        .form-control::placeholder {
            color: #ddd;
        }

        .predict-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(45deg, #00c853, #64dd17);
            color: white;
            transition: 0.4s;
            margin-top: 20px;
        }

        .predict-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(0, 255, 120, 0.6);
        }

        .prediction-box {
            margin-top: 35px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(0, 255, 100, 0.15);
            border: 1px solid rgba(0, 255, 100, 0.3);
            text-align: center;
            color: white;
            animation: float 3s ease-in-out infinite;
        }

        .prediction-box h2 {
            font-weight: 700;
            color: #00ff99;
        }

        .top-icon {
            text-align: center;
            margin-bottom: 20px;
        }

        .top-icon i {
            font-size: 70px;
            color: #00ff99;
            animation: float 3s infinite;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 25px;
            font-size: 14px;
        }

        @media(max-width:768px) {

            .title {
                font-size: 2rem;
            }

            .glass-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container main-container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="glass-card">

                    <!-- Icon -->
                    <div class="top-icon">
                        <i class="fa-solid fa-seedling"></i>
                    </div>

                    <!-- Title -->
                    <h1 class="title">
                        Crop Yield Prediction
                    </h1>

                    <p class="subtitle">
                        Smart Agriculture Using Machine Learning 🌱
                    </p>

                    <!-- Form -->
                    <form action="/predict" method="POST">

                        <div class="row g-4">

                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fa-solid fa-calendar"></i>
                                    Year
                                </label>

                                <input type="number"
                                    class="form-control"
                                    name="Year"
                                    placeholder="Enter Year"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fa-solid fa-cloud-rain"></i>
                                    Rainfall (mm/year)
                                </label>

                                <input type="number"
                                    step="any"
                                    class="form-control"
                                    name="average_rain_fall_mm_per_year"
                                    placeholder="Enter Rainfall"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fa-solid fa-flask"></i>
                                    Pesticides (tonnes)
                                </label>

                                <input type="number"
                                    step="any"
                                    class="form-control"
                                    name="pesticides_tonnes"
                                    placeholder="Enter Pesticides"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fa-solid fa-temperature-three-quarters"></i>
                                    Average Temperature
                                </label>

                                <input type="number"
                                    step="any"
                                    class="form-control"
                                    name="avg_temp"
                                    placeholder="Enter Temperature"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fa-solid fa-earth-asia"></i>
                                    Country / Area
                                </label>

                                <input type="text"
                                    class="form-control"
                                    name="Area"
                                    placeholder="Enter Country"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fa-solid fa-wheat-awn"></i>
                                    Crop Item
                                </label>

                                <input type="text"
                                    class="form-control"
                                    name="Item"
                                    placeholder="Enter Crop Name"
                                    required>
                            </div>

                        </div>

                        <!-- Button -->
                        <button type="submit" class="predict-btn">
                            <i class="fa-solid fa-chart-line"></i>
                            Predict Crop Yield
                        </button>

                    </form>

                    <!-- Prediction Result -->
                    {% if prediction %}

                    <div class="prediction-box">

                        <h2>
                            🌾 Predicted Yield
                        </h2>

                        <h1>
                            {{ prediction }}
                        </h1>

                    </div>

                    {% endif %}

                </div>

                <!-- Footer -->
                <div class="footer">
                    Developed with ❤️ using Flask & Machine Learning
                </div>

            </div>

        </div>

    </div>

</body>

</html>
